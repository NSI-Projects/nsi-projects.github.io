<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Skyscrapper</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
        <link rel="stylesheet" href="style.css">
        <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/brython@3.11.0/brython.min.js"></script>
        <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/brython@3.11.0/brython_stdlib.js"></script>
    </head>
    <body onload="brython()">
        <header>
            <h1>⚙️ Bienvenue sur le Skyscrapper ⚙️</h1>
            <h2>✨ Le générateur de grille de Skyscrapper ✨</h2>
        </header>
        <main>
            <div class="parameters">
                <h3>Paramètres de la grille</h3>
                <input type="range" min="1" max="10" step="1" value="4" id="size" title="Choisir la taille de la grille">
                <label class="cb" id="checkbox_label">
                    <input type="checkbox" id="checkbox">
                    <span class="box"></span>
                    Afficher la solution
                </label>
                <button id="generate">Générer la grille : 4x4</button>
            </div>
            <div class="grille">
                <svg id="gridSVG" class="gridSVG"></svg>
            </div>
        </main>
    </body>
    <script type="text/javascript" src="script.js"></script>
    <script type="text/python" src="script.py"></script>
</html>
